# SSH is key-only. "user" has no password, so password, keyboard-interactive
# and empty-password logins are all refused. Keys come from authorized_keys
# on the boot partition (imported by rgos-bootconfig at every boot).
PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
AuthenticationMethods publickey
AuthorizedKeysFile /etc/ssh/authorized_keys/%u
