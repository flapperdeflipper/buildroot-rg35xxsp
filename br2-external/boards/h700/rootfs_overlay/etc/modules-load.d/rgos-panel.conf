# The LCD panel sits on an SPI bus. SPI devices announce their driver as
# "spi:<first compatible without vendor>" (e.g. spi:rg35xx-sp-v2-panel), but
# the generic panel driver only offers spi:panel-mipi-dpi-spi, so udev never
# loads it. Without the panel, the LCD controller never binds and the screen
# (and backlight) stay off. Load it explicitly; it reads its init sequence
# from /lib/firmware/panels/, which is why it isn't built into the kernel.
panel_mipi
