# RGOS notifications (mako): top right, below the panel; click to dismiss.
# Copy to ~/.config/mako/config and start mako without --config to customise.
font=DejaVu Sans 10
anchor=top-right
margin=32,6,6,6
width=300
height=120
padding=8
border-size=1
border-radius=6
background-color=#2b2b2bee
text-color=#eeeeee
border-color=#4a90d9
progress-color=over #4a90d9
icons=1
max-icon-size=32
default-timeout=6000
layer=overlay

[urgency=critical]
border-color=#e05555
default-timeout=0
