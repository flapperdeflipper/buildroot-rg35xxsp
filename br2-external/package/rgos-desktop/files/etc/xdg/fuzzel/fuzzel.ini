# RGOS launcher (override in ~/.config/fuzzel/fuzzel.ini)
[main]
font=DejaVu Sans:size=11
terminal=foot -e
layer=overlay
lines=10
width=40
horizontal-pad=12
vertical-pad=8
inner-pad=4
icons-enabled=no

[colors]
background=1d2021f0
text=ebdbb2ff
match=fabd2fff
selection=458588ff
selection-text=ffffffff
selection-match=fabd2fff
border=458588ff

[border]
width=2
radius=4
