# mpv keys for RGOS YouTube, made for the pad (rgos-padd mouse mode sends
# A = left click, B = Esc, L1/R1 = wheel, d-pad moves the pointer).
# Keyboard keys keep mpv's defaults (space, arrows, q, f, ...).
MBTN_LEFT     cycle pause
ESC           quit
WHEEL_UP      seek 10
WHEEL_DOWN    seek -10
MBTN_RIGHT    cycle sub
