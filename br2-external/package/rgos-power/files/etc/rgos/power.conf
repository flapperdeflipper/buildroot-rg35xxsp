# RGOS power settings (defaults).
# Override any of these in ~/.config/rgos/power.conf (same format), then:
#   rgos-power reload
# Times are in seconds; 0 disables that step.

# --- Idle (screen) -----------------------------------------------------------
dim_after=60            # dim the backlight after this much idle time
dim_brightness=10       # dimmed brightness, percent of maximum
off_after=180           # turn the screen off after this much idle time

# --- Sleep -------------------------------------------------------------------
suspend_after=600       # suspend after this much idle time, on battery only
suspend_on_ac=0         # also auto-suspend while charging (0/1)
lid_action=suspend      # lid closed: suspend | screen-off | nothing
power_key_action=suspend    # short power-key press: suspend | screen-off | nothing
# suspend_mode: auto = deep sleep when the firmware provides it (H700: TF-A
# SRAM suspend stub), otherwise s2idle. Force s2idle|deep if auto guesses
# wrong. System-level: read as root, so overrides go in /etc/rgos, not ~.
suspend_mode=auto
suspend_mute_dac=1      # mute the codec DAC around suspend (no pop)
suspend_led_off=1       # power LED off while suspended
suspend_poweroff_min=0  # minutes in suspend before a clean poweroff (0 = off;
                         # off by default to protect unsaved desktop work)

# --- Radios ------------------------------------------------------------------
# Remembered across reboots once toggled; these are the first-boot defaults.
wifi_default=off        # on | off
bluetooth_default=off   # on | off

# --- Battery -----------------------------------------------------------------
warn_percent=10         # notify below this level (once per discharge)
poweroff_percent=3      # clean shutdown below this level (when not charging)
battery_mwh=12210       # capacity for time-left estimates (3300 mAh x 3.7 V)

# --- Performance profile -----------------------------------------------------
profile=balanced        # performance | balanced | battery
profile_ac=             # switch to this profile on external power (empty = stay
                        # on the current one; back to `profile` when unplugged)
cpu_turbo=0             # allow the 1.512 GHz turbo OPP (cpufreq boost; stock
                         # ceiling 1.416 GHz). Off by default.
gpu_max_mhz=600         # GPU top frequency; 648 = the OPP above stock — fine
                         # on most units, not vendor-tested
