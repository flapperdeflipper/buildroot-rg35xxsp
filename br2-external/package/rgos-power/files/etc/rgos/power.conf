# RGOS power settings (defaults).
# Override any of these in ~/.config/rgos/power.conf (same format), then:
#   rgos-power reload
# Times are in seconds; 0 disables that step.

# --- Idle (screen) -----------------------------------------------------------
dim_after=60            # dim the backlight after this much idle time
dim_brightness=10       # dimmed brightness, percent of maximum
off_after=180           # turn the screen off after this much idle time

# --- Sleep -------------------------------------------------------------------
suspend_after=600       # suspend after this much idle time, on battery only
suspend_on_ac=0         # also auto-suspend while charging (0/1)
lid_action=suspend      # lid closed: suspend | screen-off | nothing
power_key_action=suspend    # short power-key press: suspend | screen-off | nothing

# --- Radios ------------------------------------------------------------------
# Remembered across reboots once toggled; these are the first-boot defaults.
wifi_default=off        # on | off
bluetooth_default=off   # on | off

# --- Battery -----------------------------------------------------------------
warn_percent=10         # notify below this level
poweroff_percent=3      # clean shutdown below this level (when not charging)
battery_mwh=12210       # capacity for time-left estimates (3300 mAh x 3.7 V)

# --- Performance profile -----------------------------------------------------
profile=balanced        # performance | balanced | battery
