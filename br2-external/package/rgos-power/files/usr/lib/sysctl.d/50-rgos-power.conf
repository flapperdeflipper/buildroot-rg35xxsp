# Write dirty pages back every 15 s instead of 5 s, so the SD card (and the
# CPU) wake up less often. Data older than 30 s is still written out.
vm.dirty_writeback_centisecs = 1500

# Reboot 20 s after a panic: there is no console on this device, a hung
# handheld is otherwise a battery drain until the user long-presses.
kernel.panic = 20

# Lockup detector off: saves perf-counter work, and with no console it only
# turns a hang into another hang. ("-" = ignore when the key is absent.)
-kernel.nmi_watchdog = 0

# Desktop and (later) emulator workloads: many mmaps and file watches.
vm.max_map_count = 2147483642
fs.inotify.max_user_instances = 1024
fs.inotify.max_user_watches = 524288
