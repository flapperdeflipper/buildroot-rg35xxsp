# rgos-padd button mapping.
#
# Copy to ~/.config/rgos/padd.conf to customise, then reload with:
#   pkill -HUP rgos-padd
#
# Syntax:
#   set <option> <value...>
#   <layer> <button> <action> [args]
#
# Layers:  mouse  pointer mode (the default): d-pad moves the pointer
#          nav    keys mode: buttons are keys (arrows, Enter, Esc, ...)
#          osk    on-screen keyboard shown: d-pad steps the pointer per key
#          menu   used while the hold button (Menu) is held, in every mode;
#                 tapping Menu alone runs its binding from the current mode
#
# Actions: key KEY_A[+KEY_B...]       keys held while the button is held
#          click left|right|middle   mouse button
#          move up|down|left|right   pointer motion (accelerates)
#          step up|down|left|right   pointer jump of one OSK key (osk_step)
#          scroll up|down|left|right wheel, repeats while held
#          exec <shell command>      run on press
#          mode nav|mouse|osk|passthrough|toggle-mouse|toggle-osk
#
# Mode hooks (shell commands):
#   set on_enter <mode> <command>
#   set on_leave <mode> <command>
# Lid switch (shell commands):
#   set on_lid_close <command>
#   set on_lid_open <command>
#
# Button names (RG35XX SP, mainline gpio-keys):
#   A=BTN_EAST  B=BTN_SOUTH  X=BTN_NORTH  Y=BTN_WEST
#   D-pad=BTN_DPAD_UP/DOWN/LEFT/RIGHT  L1=BTN_TL R1=BTN_TR L2=BTN_TL2 R2=BTN_TR2
#   Select=BTN_SELECT  Start=BTN_START  Menu=BTN_MODE
# Key names are the KEY_* constants from linux/input-event-codes.h.
# USB/Bluetooth controllers report the same BTN_* codes and work too.

set hold_button BTN_MODE
# The desktop is pointer-driven: start in mouse mode
set start_mode mouse
# Screen size, for absolute pointer moves (rgos-padctl warp X Y)
set screen 640 480
# Passthrough (game) mode releases the pad; this chord brings it back
set passthrough_exit BTN_MODE+BTN_SELECT
# D-pad tap = one exact nudge of <px>; holding longer than <delay_ms> glides
set mouse_tap 2 180
# Glide speed: start px/tick, max px/tick, ticks to reach max (16 ms ticks)
set mouse_speed 1 12 60
set scroll_repeat_ms 120
# Pointer jump per d-pad press in osk mode (one wvkbd key pitch at 640px
# wide / 180px high: width height)
set osk_step 49 45

# Show/hide the on-screen keyboard with osk mode; park the pointer on it
set on_enter osk rgos-osk show
set on_leave osk rgos-osk hide

# Lid: handled by rgos-power (lid_action in /etc/rgos/power.conf, default suspend)
set on_lid_close rgos-power event lid-close
set on_lid_open rgos-power event lid-open

# --- nav mode ---------------------------------------------------------------
nav   BTN_DPAD_UP      key KEY_UP
nav   BTN_DPAD_DOWN    key KEY_DOWN
nav   BTN_DPAD_LEFT    key KEY_LEFT
nav   BTN_DPAD_RIGHT   key KEY_RIGHT
nav   BTN_EAST         key KEY_ENTER
nav   BTN_SOUTH        key KEY_ESC
nav   BTN_NORTH        key KEY_BACKSPACE
nav   BTN_WEST         key KEY_SPACE
nav   BTN_TL           key KEY_LEFTSHIFT+KEY_TAB
nav   BTN_TR           key KEY_TAB
nav   BTN_TL2          key KEY_LEFTALT+KEY_LEFTSHIFT+KEY_TAB
nav   BTN_TR2          key KEY_LEFTALT+KEY_TAB
nav   BTN_SELECT       mode toggle-osk
nav   BTN_START        key KEY_LEFTMETA+KEY_SPACE
nav   BTN_MODE         mode toggle-mouse

# --- mouse mode -------------------------------------------------------------
mouse BTN_DPAD_UP      move up
mouse BTN_DPAD_DOWN    move down
mouse BTN_DPAD_LEFT    move left
mouse BTN_DPAD_RIGHT   move right
mouse BTN_EAST         click left
mouse BTN_SOUTH        click right
mouse BTN_NORTH        click middle
mouse BTN_WEST         key KEY_ESC
mouse BTN_TL           scroll up
mouse BTN_TR           scroll down
mouse BTN_TL2          key KEY_LEFTALT+KEY_LEFTSHIFT+KEY_TAB
mouse BTN_TR2          key KEY_LEFTALT+KEY_TAB
mouse BTN_SELECT       mode toggle-osk
mouse BTN_START        key KEY_LEFTMETA+KEY_SPACE
mouse BTN_MODE         mode toggle-mouse

# --- osk mode (on-screen keyboard visible) ----------------------------------
osk   BTN_DPAD_UP      step up
osk   BTN_DPAD_DOWN    step down
osk   BTN_DPAD_LEFT    step left
osk   BTN_DPAD_RIGHT   step right
osk   BTN_EAST         click left
osk   BTN_SOUTH        mode toggle-osk
osk   BTN_NORTH        key KEY_BACKSPACE
osk   BTN_WEST         key KEY_SPACE
osk   BTN_TL           key KEY_LEFT
osk   BTN_TR           key KEY_RIGHT
osk   BTN_TL2          move left
osk   BTN_TR2          move right
osk   BTN_START        key KEY_ENTER
osk   BTN_SELECT       mode toggle-osk
osk   BTN_MODE         mode toggle-osk

# --- Menu held --------------------------------------------------------------
menu  BTN_DPAD_UP      exec rgos-brightness up
menu  BTN_DPAD_DOWN    exec rgos-brightness down
menu  BTN_DPAD_LEFT    key KEY_PAGEUP
menu  BTN_DPAD_RIGHT   key KEY_PAGEDOWN
menu  BTN_EAST         key KEY_LEFTCTRL+KEY_C
menu  BTN_WEST         key KEY_LEFTCTRL+KEY_LEFTSHIFT+KEY_V
menu  BTN_SOUTH        key KEY_LEFTALT+KEY_F4
menu  BTN_NORTH        exec rgos-wifi
menu  BTN_TL           key KEY_LEFTALT+KEY_LEFT
menu  BTN_TR           key KEY_LEFTALT+KEY_RIGHT
menu  BTN_TL2          key KEY_LEFTCTRL+KEY_MINUS
menu  BTN_TR2          key KEY_LEFTCTRL+KEY_EQUAL
menu  BTN_SELECT       mode passthrough
menu  BTN_START        exec rgos-power-menu
