# rgos-oskd: opens the on-screen keyboard like a phone when a text app is
# activated and no USB/Bluetooth keyboard is attached. Copy to
# ~/.config/rgos/oskd.conf to customise.

# App-ids (substrings, case-insensitive) that want the keyboard. labwc
# reports the Wayland app_id ("foot") or, for X11 apps, the WM_CLASS
# ("Mousepad", "pcmanfm").
set apps foot mousepad pcmanfm

# Also match window titles (off: app_id only, to avoid surprises like a
# file called "notes.txt" in the file manager)
set match_title 0

# Never show the keyboard while a hardware keyboard is attached, and hide
# it when one gets plugged in
set keyboard_watch 1

# What to run; these are idempotent on rgos-padd's side
set on_show rgos-padctl osk on
set on_hide rgos-padctl osk off
